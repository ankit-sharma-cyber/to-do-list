<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker Practice - To-Do List</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #f4f1ea;
        color: #20231f;
      }
      main {
        max-width: 560px;
        margin: 10vh auto;
        padding: 32px;
        background: #fffdf8;
        border: 1px solid #d8d1c4;
        border-radius: 12px;
        box-shadow: 0 14px 35px #302b2214;
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 11px 12px;
        border: 1px solid #bdb5a7;
        border-radius: 6px;
        font: inherit;
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        background: #235347;
        color: white;
        cursor: pointer;
        font: inherit;
      }
      button.delete {
        padding: 6px 9px;
        background: #9b3d32;
      }
      ul {
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #e5ded2;
      }
      .empty {
        color: #70695e;
      }
      .error {
        color: #9b3d32;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>My To-Do List</h1>
      <form id="todo-form">
        <input
          id="text"
          placeholder="What do you need to do?"
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <ul id="list">
        <li class="empty">Loading...</li>
      </ul>
    </main>
    <script>
      const form = document.getElementById("todo-form");
      const input = document.getElementById("text");
      const list = document.getElementById("list");
      const error = document.getElementById("error");

      function showError(message = "") {
        error.textContent = message;
      }

      function renderTodos(todos) {
        list.innerHTML = "";
        if (!todos.length) {
          list.innerHTML = '<li class="empty">Nothing here yet.</li>';
          return;
        }
        todos.forEach((todo) => {
          const item = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = todo.text;
          const remove = document.createElement("button");
          remove.className = "delete";
          remove.textContent = "Delete";
          remove.addEventListener("click", () => removeTodo(todo._id));
          item.append(text, remove);
          list.appendChild(item);
        });
      }

      async function loadTodos() {
        try {
          const response = await fetch("/todos");
          if (!response.ok) throw new Error("Could not load todos");
          renderTodos(await response.json());
        } catch (err) {
          showError(err.message);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        showError();
        const response = await fetch("/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!response.ok) {
          showError("Could not add todo");
          return;
        }
        input.value = "";
        loadTodos();
      });

      async function removeTodo(id) {
        const response = await fetch(`/todos/${id}`, { method: "DELETE" });
        if (!response.ok) showError("Could not delete todo");
        loadTodos();
      }

      loadTodos();
    </script>
  </body>
</html>
